name: Extended Project CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  mobile-build-test:
    name: Android build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Build, lint and test
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew build lint test --stacktrace

  pc-linux-build:
    name: Linux PC application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevdev-dev ninja-build
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: gcc_64
      - name: Configure
        working-directory: pc
        run: cmake --preset linux
      - name: Build
        working-directory: pc
        run: cmake --build build-linux --config Release --parallel 2
