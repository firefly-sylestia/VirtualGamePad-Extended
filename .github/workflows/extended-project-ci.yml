name: Extended Project CI

concurrency:
  group: extended-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["main"]
  push:
    # A `v*` tag publishes the Windows installer as a release, which is what the
    # app's own update check reads; a branch push only builds and uploads.
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  protocol-sync:
    name: Protocol button flags in sync (mobile vs PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare shared GameButtons flag values
        run: |
          set -euo pipefail
          extract() { grep -oE 'GamepadButtons_[A-Za-z0-9]+ = 0x[0-9A-Fa-f]+' "$1" | sort; }
          diff <(extract mobile/VGP_Data_Exchange/C/GameButtons.h) \
               <(extract pc/VGP_Data_Exchange/C/GameButtons.h)

  secrets-guard:
    name: No signing material in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refuse tracked keys, keystores and signing.properties
        run: |
          set -euo pipefail
          offenders="$(git ls-files | grep -Ei '(^|/)(signing\.properties|id_rsa|id_ed25519)$|\.(jks|keystore|p12|pfx|pem|pk8)$' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Signing material must never be committed. Remove these files from git:"
            printf '%s\n' "$offenders"
            exit 1
          fi
          if git ls-files -z | xargs -0 --no-run-if-empty grep -lE -- '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'; then
            echo "::error::A private key is committed in one of the files listed above."
            exit 1
          fi
          echo "No signing material is tracked."

  mobile-build-test:
    name: Android build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Build, lint and test
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew build lint test --stacktrace
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgp-android-apk
          path: mobile/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 24

  mobile-signed-release:
    name: Signed Android release APK
    # The signing key only ever exists on this runner: it comes from repository
    # secrets, is written outside of git, and is deleted again at the end.
    # Pull requests deliberately skip this job, because forks have no secrets.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Run 'python3 tools/signing/vgp_signing.py' locally to create the key,"
            echo "then upload it with the 'gh secret set' commands the wizard prints."
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Restore the release keystore
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Write signing.properties from the secrets
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "STORE_FILE=$(pwd)/release.keystore"
            echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } > signing.properties
      - name: Build the release APK
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Check the APK really is signed with the release key
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | sort | head -1)"
          if [ -z "$apk" ]; then
            echo "::error::The release build produced no APK."
            ls -laR app/build/outputs/apk/release || true
            exit 1
          fi
          echo "APK: $apk"

          # The runner image keeps the SDK somewhere slightly different between
          # images, so search the ones it is known to use before giving up.
          apksigner=""
          for sdk in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
              apksigner="$(find "$sdk/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort | tail -1)"
              if [ -n "$apksigner" ]; then break; fi
            fi
          done
          if [ -z "$apksigner" ]; then
            apksigner="$(command -v apksigner || true)"
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found (ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset})."
            exit 1
          fi
          echo "apksigner: $apksigner"

          # Only the outcome is logged: the signer's name is not needed here.
          report="$("$apksigner" verify --print-certs "$apk" 2>&1 || true)"
          printf '%s\n' "$report" | grep -vE 'certificate DN' || true

          apk_digest="$(printf '%s\n' "$report" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' || true)"
          if [ -z "$apk_digest" ]; then
            echo "::error::$apk is not signed, so it cannot be installed over an earlier build."
            exit 1
          fi

          # Signing with *a* key is not enough: it has to be this keystore's key,
          # or Android refuses to install the update.
          crypto_report="$(keytool -list -v -keystore release.keystore -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 || true)"
          key_digest="$(printf '%s\n' "$crypto_report" | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f' || true)"
          if [ -z "$key_digest" ]; then
            echo "::error::The signing key could not be read back from the restored keystore."
            exit 1
          fi
          if [ "$apk_digest" != "$key_digest" ]; then
            echo "::error::$apk is not signed with the release key."
            echo "APK signer SHA-256: $apk_digest"
            echo "Keystore SHA-256:   $key_digest"
            exit 1
          fi
          echo "$apk is signed with the release key ($apk_digest)."
      - name: Remove the key material from the runner
        if: always()
        working-directory: mobile
        run: |
          rm -f release.keystore signing.properties
      - name: Upload the signed APK
        uses: actions/upload-artifact@v7
        with:
          name: vgp-android-release-signed
          path: mobile/app/build/outputs/apk/release/*.apk
          retention-days: 30

  pc-linux-build:
    name: Linux PC application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevdev-dev ninja-build qt6-base-dev qt6-base-dev-tools
      - name: Configure
        working-directory: pc
        run: cmake --preset linux
      - name: Build
        working-directory: pc
        run: cmake --build build-linux --config Release --parallel 2
      - name: Upload Linux binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgp-pc-linux
          path: pc/build-linux/Release/VGamepadPC
          if-no-files-found: warn
          retention-days: 24

  pc-windows-build:
    name: Windows PC application build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        working-directory: pc
        run: cmake --preset windows
      - name: Build
        working-directory: pc
        run: cmake --build build-windows --config Release --parallel 2
      # A step condition cannot read `secrets` (GitHub rejects the file), so the
      # presence of the certificate is decided in a step and published as an
      # output for the signing step below to read.
      - name: Check for a Windows code-signing certificate
        id: pfx
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Host "WINDOWS_PFX_BASE64 is not set, so the executable is left unsigned."
          }
      - name: Sign the Windows binary
        if: steps.pfx.outputs.configured == 'true'
        working-directory: pc
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 build-windows\Release\VGamepadPC.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign VGamepadPC.exe" }
          Remove-Item $pfx -Force
      # The app is shipped as one installer to run, not as a folder to extract:
      # `cmake --install` deploys it with its Qt DLLs, and Inno Setup packs that
      # folder into a single executable.
      - name: Build the Windows installer
        working-directory: pc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = Select-String -Path CMakeLists.txt -Pattern 'set\(APP_VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)'
          if (-not $match) { throw "APP_VERSION was not found in pc/CMakeLists.txt" }
          $version = $match.Matches[0].Groups[1].Value
          cmake --install build-windows --prefix dist --config Release
          # windeployqt may deploy into bin/ or beside the prefix, depending on
          # the Qt install, so the folder that actually holds the exe is packed.
          $exe = Get-ChildItem dist -Recurse -Filter VGamepadPC.exe | Select-Object -First 1
          if (-not $exe) { throw "the deployed application was not found under pc/dist" }
          $source = $exe.Directory.FullName
          Write-Host "Packing $source"
          # Without this library the shipped app creates no controller at all —
          # it would fall back to input injection that no game or emulator lists
          # — so its absence fails the build instead of reaching a user.
          if (-not (Test-Path (Join-Path $source "ViGEmClient.dll"))) {
            throw "ViGEmClient.dll was not deployed beside VGamepadPC.exe"
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not on this runner" }
          # OutputDir is relative to the .iss file, so the installer lands beside
          # the script rather than in the working directory.
          & $iscc "/DSourceDir=$source" "/DAppVersion=$version" "/DOutputDir=installer-out" "installer\VGamepadPC.iss"
          if (-not (Test-Path "installer\installer-out\*.exe")) { throw "the installer was not produced" }
          Get-ChildItem "installer\installer-out"

      # The file a user actually downloads is the Setup executable, and an
      # unsigned one makes Windows show "Unknown publisher" and SmartScreen
      # block it. The inner VGamepadPC.exe is signed above, but Inno Setup
      # produces a brand-new file, so it needs the signature too.
      - name: Sign the Windows installer
        if: steps.pfx.outputs.configured == 'true'
        working-directory: pc
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($installer in (Get-ChildItem "installer\installer-out\*.exe")) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign $($installer.Name)" }
            # The certificate is self-signed (see tools/signing/README.md), so a
            # trust-chain check always fails with "terminated in a root" — even
            # on a correct signature. What must hold is that the file carries a
            # signature and that it still matches the file's bytes; a missing or
            # tampered one is a real failure and is caught here.
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -eq "NotSigned" -or $signature.Status -eq "HashMismatch") {
              throw "$($installer.Name) is $($signature.Status): signing did not take effect"
            }
            Write-Host "Signed: $($installer.Name) [$($signature.Status)] $($signature.SignerCertificate.Subject)"
          }
          Remove-Item $pfx -Force

      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgp-pc-windows-installer
          path: pc/installer/installer-out/*.exe
          if-no-files-found: warn
          retention-days: 24

      - name: Upload Windows binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgp-pc-windows
          path: pc/build-windows/Release/
          if-no-files-found: warn
          retention-days: 24

  # Runs only for a `v*` tag: the installer built above becomes a release asset,
  # so the download is one .exe and the app's update check has something to find.
  pc-windows-release:
    name: Publish the Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pc-windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@v5
        with:
          name: vgp-pc-windows-installer
          path: installer
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l installer
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" installer/*.exe --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" installer/*.exe \
              --repo "$GITHUB_REPOSITORY" \
              --title "VirtualGamePad Extended $tag" \
              --notes "Windows installer for $tag. Download the .exe and run it; the app's Check for updates button finds this release on later versions."
          fi
