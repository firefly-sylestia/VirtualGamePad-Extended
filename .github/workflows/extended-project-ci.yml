name: Extended Project CI

concurrency:
  group: extended-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  protocol-sync:
    name: Protocol button flags in sync (mobile vs PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare shared GameButtons flag values
        run: |
          set -euo pipefail
          extract() { grep -oE 'GamepadButtons_[A-Za-z0-9]+ = 0x[0-9A-Fa-f]+' "$1" | sort; }
          diff <(extract mobile/VGP_Data_Exchange/C/GameButtons.h) \
               <(extract pc/VGP_Data_Exchange/C/GameButtons.h)

  secrets-guard:
    name: No signing material in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refuse tracked keys, keystores and signing.properties
        run: |
          set -euo pipefail
          offenders="$(git ls-files | grep -Ei '(^|/)(signing\.properties|id_rsa|id_ed25519)$|\.(jks|keystore|p12|pfx|pem|pk8)$' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Signing material must never be committed. Remove these files from git:"
            printf '%s\n' "$offenders"
            exit 1
          fi
          if git ls-files -z | xargs -0 --no-run-if-empty grep -lE -- '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'; then
            echo "::error::A private key is committed in one of the files listed above."
            exit 1
          fi
          echo "No signing material is tracked."

  mobile-build-test:
    name: Android build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Build, lint and test
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew build lint test --stacktrace
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgp-android-apk
          path: mobile/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 24

  mobile-signed-release:
    name: Signed Android release APK
    # The signing key only ever exists on this runner: it comes from repository
    # secrets, is written outside of git, and is deleted again at the end.
    # Pull requests deliberately skip this job, because forks have no secrets.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Run 'python3 tools/signing/vgp_signing.py' locally to create the key,"
            echo "then upload it with the 'gh secret set' commands the wizard prints."
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Restore the release keystore
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Write signing.properties from the secrets
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "STORE_FILE=$(pwd)/release.keystore"
            echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } > signing.properties
      - name: Build the release APK
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Check the APK really is signed with the release key
        working-directory: mobile
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$apk" ]; then
            echo "::error::The release build produced no APK."
            exit 1
          fi
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -1)"
          signers="$("$apksigner" verify --print-certs "$apk" | grep -c 'Signer #' || true)"
          if [ "$signers" -lt 1 ]; then
            echo "::error::$apk is not signed."
            exit 1
          fi
          if "$apksigner" verify --print-certs "$apk" | grep -q 'CN=Android Debug'; then
            echo "::error::$apk was signed with the debug key, not the release key."
            exit 1
          fi
          echo "$apk carries $signers release signature(s)."
      - name: Remove the key material from the runner
        if: always()
        working-directory: mobile
        run: |
          rm -f release.keystore signing.properties
      - name: Upload the signed APK
        uses: actions/upload-artifact@v7
        with:
          name: vgp-android-release-signed
          path: mobile/app/build/outputs/apk/release/*.apk
          retention-days: 30

  pc-linux-build:
    name: Linux PC application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevdev-dev ninja-build qt6-base-dev qt6-base-dev-tools
      - name: Configure
        working-directory: pc
        run: cmake --preset linux
      - name: Build
        working-directory: pc
        run: cmake --build build-linux --config Release --parallel 2
      - name: Upload Linux binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgp-pc-linux
          path: pc/build-linux/Release/VGamepadPC
          if-no-files-found: warn
          retention-days: 24

  pc-windows-build:
    name: Windows PC application build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        working-directory: pc
        run: cmake --preset windows
      - name: Build
        working-directory: pc
        run: cmake --build build-windows --config Release --parallel 2
      # A step condition cannot read `secrets` (GitHub rejects the file), so the
      # presence of the certificate is decided in a step and published as an
      # output for the signing step below to read.
      - name: Check for a Windows code-signing certificate
        id: pfx
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Host "WINDOWS_PFX_BASE64 is not set, so the executable is left unsigned."
          }
      - name: Sign the Windows binary
        if: steps.pfx.outputs.configured == 'true'
        working-directory: pc
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 build-windows\Release\VGamepadPC.exe
          Remove-Item $pfx -Force
      - name: Upload Windows binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgp-pc-windows
          path: pc/build-windows/Release/
          if-no-files-found: warn
          retention-days: 24
